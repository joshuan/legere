# Legere — a self-contained deployment (docs/12 §12.7).
#
#   curl -fsSL https://raw.githubusercontent.com/joshuan/legere/main/deploy/{docker-compose.yaml,.env.example} -o docker-compose.yaml -o .env
#   $EDITOR .env          # LIBRARY_PATH and the four secrets, at least
#   docker compose up -d
#
# Everything the app needs runs here: PostgreSQL with pgvector, Stirling-PDF for the heavy PDF work,
# and MinIO for the artifacts Legere produces. Only the app and MinIO publish a port; the database
# and Stirling stay on the internal network. Migrations run once, in their own container, before the
# app starts (`migrate` below).
#
# Using a managed S3 instead: point the S3_* variables at it, drop S3_PUBLIC_ENDPOINT, and delete the
# `minio` and `minio-init` services below.
#
# The project is named `legere`. Inside a clone of the repository that collides with the development
# stack of docs/12 §12.5, which takes the same name from its directory — run this one with
# `docker compose -p <other-name>` there.
name: legere

services:
  app:
    image: ghcr.io/joshuan/legere:${LEGERE_VERSION:-latest}
    restart: unless-stopped
    # The image would migrate and then start; here the migration is `migrate` below, so the app is
    # only ever the server (docs/12 §12.6).
    command: ['node', 'dist/server/main.js']
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      stirling: { condition: service_started }
      docling: { condition: service_started }
    # 🔒 The process that decodes whatever a scan finds — PDFs, images, through native libraries —
    # runs as uid 1000 with no capabilities, cannot gain any, cannot write to its own filesystem and
    # cannot use more memory than it is given. A hole in libvips then costs a container, not a host.
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    # The two paths that genuinely need writing: Node's own temporary files, and the incremental
    # cache Next writes on the first render. Both are throwaway, so both are memory, not disk.
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /app/.next/cache:uid=1000,gid=1000,size=64m
    # Raise this if `document-process` jobs start dying with exit code 137: OCR and image conversion
    # of a large scan are what needs the room.
    mem_limit: ${APP_MEMORY_LIMIT:-2g}
    environment:
      NODE_ENV: production
      PORT: 8080
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL to the URL you open in the browser}
      AUTH_SECRET: ${AUTH_SECRET:?generate one with `openssl rand -base64 32`}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-}
      DATABASE_URL: postgresql://legere:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/legere?schema=public
      LIBRARY_ROOT: /library
      STIRLING_URL: http://stirling:8080
      DOCLING_URL: ${DOCLING_URL-http://docling:5001}
      DOCLING_PICTURE_DESCRIPTION: ${DOCLING_PICTURE_DESCRIPTION-false}
      # The server reaches MinIO inside this network; the browser reaches it through the published
      # port. A presigned URL is only valid for the host it was signed against, hence both.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT to how the browser reaches MinIO}
      S3_REGION: us-east-1
      S3_BUCKET: legere
      # 🔒 The scoped service account `minio-init` creates, not the MinIO root credentials: this key
      # reaches the `legere` bucket and nothing else — no other bucket, no user administration, no
      # console — and it is rotated by editing `.env`, without touching the store's root password.
      S3_ACCESS_KEY_ID: ${MINIO_APP_USER:-legere-app}
      S3_SECRET_ACCESS_KEY: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD}
      S3_FORCE_PATH_STYLE: 'true'
      SIGNED_URL_TTL_SEC: ${SIGNED_URL_TTL_SEC:-300}
      # 🔒 Required, and the app refuses to start without it: the six-digit code that creates,
      # verifies and recovers every account arrives by email and is written nowhere else — least of
      # all to this container's log, which is where it used to go. Set ALLOW_UNCONFIGURED_EMAIL to
      # run with no mail server anyway, knowing nobody can sign up (docs/12 §12.4a).
      # 🔒 SEC-62. 465 and `secure`, not 587 and STARTTLS: on 465 the session is TLS from the first
      # byte, and a relay that will not speak it fails loudly. STARTTLS is an upgrade the *server*
      # offers, and an attacker on the path who removes that one line from the greeting gets the
      # relay password and every code in the clear, with nothing failing anywhere (docs/12 §12.8).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Legere <no-reply@example.com>}
      ALLOW_UNCONFIGURED_EMAIL: ${ALLOW_UNCONFIGURED_EMAIL:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-rus+eng}
      # Empty = categorization and vector search stay switched off, and the UI says so.
      EMBEDDINGS_API_BASE_URL: ${EMBEDDINGS_API_BASE_URL:-}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-text-embedding-3-small}
      CLASSIFIER_API_BASE_URL: ${CLASSIFIER_API_BASE_URL:-}
      CLASSIFIER_API_KEY: ${CLASSIFIER_API_KEY:-}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-}
    volumes:
      # 🔒 Read-only, and Legere never writes here anyway — this is your own document storage.
      - ${LIBRARY_PATH:?set LIBRARY_PATH to the folder holding your documents}:/library:ro
    ports:
      - '${APP_PORT:-3000}:8080'
    # 🔒 The account journal lives in this stream and nowhere else (docs/06 §6.7.1): the root
    # filesystem is read-only, so a file beside the process would be a place nothing rotates and
    # `docker compose logs` cannot show. Rotation is therefore the driver's, and these are the knobs
    # — an operator who needs a history that outlives it ships the stream somewhere that keeps it.
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: '${LOG_MAX_FILES:-5}'

  # The schema, applied once per `up` by a container that exits. Two things follow: a second app
  # replica cannot race a first one on the migration advisory lock, and the role that performs DDL
  # is named in one place, so a deployment that gives the app a DML-only role changes `DATABASE_URL`
  # here and nowhere else (docs/12 §12.6).
  migrate:
    image: ghcr.io/joshuan/legere:${LEGERE_VERSION:-latest}
    command: ['./node_modules/.bin/prisma', 'migrate', 'deploy']
    restart: 'no'
    depends_on:
      db: { condition: service_healthy }
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    mem_limit: 512m
    environment:
      DATABASE_URL: postgresql://legere:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/legere?schema=public

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: legere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: legere
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U legere -d legere']
      interval: 5s
      timeout: 5s
      retries: 20

  # Stirling with tesseract languages added (ADR-018): it runs the OCR of every image and of the
  # no-Docling path, and the stock image has no Cyrillic data at all. Build it yourself from
  # `deploy/stirling` if you would rather not pull ours.
  stirling:
    image: ghcr.io/joshuan/legere-stirling:${LEGERE_VERSION:-latest}
    restart: unless-stopped
    # Stirling 2.x demands a login by default and answers 401 to every API call; Legere talks to it
    # over the internal network without credentials (ADR-012), so the login is off and the container
    # publishes no port.
    environment:
      SECURITY_ENABLELOGIN: 'false'
      SYSTEM_ENABLEANALYTICS: 'false'
    # 🔒 SEC-78. The same block the app carries, on the container that actually opens the bytes: it
    # runs tesseract, Ghostscript, LibreOffice and PDFBox over whatever a scan found. uid 1001 is
    # the account the image now starts as (`deploy/stirling/Dockerfile`) and the one that owns every
    # directory Stirling writes; the rest is what the app has had since SEC-09.
    user: '1001:1001'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    # The five paths Stirling insists on writing, and every one of them is scratch: its generated
    # settings and heap-dump directory, its own log file, the two folders of the pipeline feature
    # Legere does not use, and the LibreOffice profile unoserver builds on the first conversion.
    # Nothing here is worth keeping between restarts, so nothing here is on a disk.
    tmpfs:
      - /configs:uid=1001,gid=1001,size=32m
      - /logs:uid=1001,gid=1001,size=64m
      - /customFiles:uid=1001,gid=1001,size=8m
      - /pipeline:uid=1001,gid=1001,size=8m
      - /home/stirlingpdfuser:uid=1001,gid=1001,size=64m
    # …but the temporary files are not scratch of that size: one conversion writes the whole upload
    # and its intermediates here, hundreds of megabytes for a large scan. A `tmpfs` would spend the
    # memory limit below on them, so this one is a disk volume — writable, and still not the image.
    volumes:
      - stirling-tmp:/tmp
    mem_limit: ${STIRLING_MEMORY_LIMIT:-2g}

  # Layout-aware parsing: headings, lists and real tables instead of a wall of text, and OCR that
  # actually reads Cyrillic (docs/05 §5.5). This is the heaviest image in the stack — a few
  # gigabytes — and the one thing you can drop if disk is scarce: unset DOCLING_URL above and Legere
  # falls back to Stirling's converter, which reads text but flattens structure.
  docling:
    image: ghcr.io/joshuan/legere-docling:${LEGERE_VERSION:-latest}
    restart: unless-stopped
    environment:
      # Models are baked into the image; nothing is fetched at runtime.
      DOCLING_SERVE_ENABLE_UI: 'false'
      # Captioning a page takes minutes; the default 120 s would 504 a request that is working
      # fine. The client has its own budget (docs/12 §12.4).
      DOCLING_SERVE_MAX_SYNC_WAIT: '3600'
    # 🔒 SEC-78, and the same block again: this is the other container that opens the bytes, and the
    # heavier of the two. uid 1001 with group 0 is what the image already drops to — its files are
    # owned `1001:0` — declared here so it stays true if the base image forgets. The memory limit is
    # the one that matters most in this file: a layout parse holds its answer in memory while it
    # builds it, and on 2026-08-18 one long PDF took the host down with the reverse proxy and sshd
    # on it. A window of a dozen pages (docs/05 §5.5) is what bounds the parse; this is what bounds
    # the container, so an expensive document dies alone.
    user: '1001:0'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    # Docling writes nothing outside /tmp: the models are baked in and read from a read-only cache.
    # A disk volume rather than a `tmpfs` for the same reason as Stirling's — the intermediates of
    # one window are large, and they must not come out of the limit below.
    volumes:
      - docling-tmp:/tmp
    mem_limit: ${DOCLING_MEMORY_LIMIT:-4g}

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-legere}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    # Published because browsers follow presigned URLs straight to it. The bucket stays private: the
    # URLs are signed and short-lived.
    ports:
      - '${MINIO_PORT:-9000}:9000'
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

  # One shot: create the bucket, then give the app a key of its own. It runs on every `up`, so every
  # step is written to converge rather than to create — the account is edited when it is already
  # there, and the policy and secret are applied again either way, which is also how a rotated
  # MINIO_APP_PASSWORD in `.env` takes effect.
  minio-init:
    image: minio/mc
    restart: 'no'
    depends_on:
      minio: { condition: service_healthy }
    # Credentials go in the environment rather than into the command line, where `docker inspect`
    # and the process table would show them.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-legere}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER:-legere-app}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/legere
        # 🔒 What the application is allowed to do, and the whole of it: read, write, delete and
        # list inside the `legere` bucket. Not another bucket, not a bucket policy, not a user, not
        # the console. The service account inherits root's permissions intersected with this, so
        # this file is the ceiling (docs/12 §12.7).
        cat >/tmp/legere-app-policy.json <<'POLICY'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:ListBucket", "s3:ListBucketMultipartUploads", "s3:GetBucketLocation"],
              "Resource": ["arn:aws:s3:::legere"]
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject",
                "s3:PutObject",
                "s3:DeleteObject",
                "s3:AbortMultipartUpload",
                "s3:ListMultipartUploadParts"
              ],
              "Resource": ["arn:aws:s3:::legere/*"]
            }
          ]
        }
        POLICY
        if mc admin user svcacct info local "$$MINIO_APP_USER" >/dev/null 2>&1; then
          mc admin user svcacct edit --secret-key "$$MINIO_APP_PASSWORD" \
            --policy /tmp/legere-app-policy.json local "$$MINIO_APP_USER"
        else
          # 🔒 Silenced: `svcacct add` prints the access key and the secret key it just set, so the
          # credential would sit in `docker compose logs minio-init` for the life of the deployment.
          # The operator does not need it back — it is the value they put in `.env`.
          mc admin user svcacct add --access-key "$$MINIO_APP_USER" \
            --secret-key "$$MINIO_APP_PASSWORD" \
            --policy /tmp/legere-app-policy.json local "$$MINIO_ROOT_USER" >/dev/null
        fi

volumes:
  db-data:
  minio-data:
  # The scratch space of the two parsers (`stirling`, `docling` above). Both root filesystems are
  # read-only, and a document's intermediates are too large to keep in memory; these hold them, and
  # nothing in them outlives a conversion. `docker compose down -v` is how they go away.
  stirling-tmp:
  docling-tmp:
