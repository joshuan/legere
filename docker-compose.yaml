# Local development dependencies only — the Legere app itself is NOT in this file
# (it runs via `npm run dev`). See docs/12 §12.5 and docs/09 §9.4.
#
# 🔒 Every port here is published on `127.0.0.1` and nothing is reachable from the network. These
# are development containers with development credentials — a database whose password is in this
# repository, an object store with its admin console, and a document converter with authentication
# switched off — and on café or corporate wifi `0.0.0.0` hands all three to whoever is on the same
# subnet (docs/12 §12.5).
services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: legere, POSTGRES_PASSWORD: legere, POSTGRES_DB: legere }
    ports: ['127.0.0.1:5432:5432']
    volumes: ['db-data:/var/lib/postgresql/data']
  stirling:
    # Built rather than pulled, for the same reason Docling is: the upstream image carries six
    # tesseract languages and Cyrillic is not among them, so a Russian scan fails the text step
    # outright (ADR-018, docs/05 §5.5). Build it by hand once if your buildx is older than 0.17:
    # `docker build -t legere-stirling:dev deploy/stirling`.
    image: legere-stirling:dev
    build: ./deploy/stirling
    ports: ['127.0.0.1:8080:8080']
    # Stirling 2.x requires a login by default and answers `401 Authentication required` to every
    # API call; Legere talks to it over the internal network without credentials (ADR-012), so the
    # login is turned off here and in the deployment example of docs/12 §12.6.
    environment: { SECURITY_ENABLELOGIN: 'false', SYSTEM_ENABLEANALYTICS: 'false' }
  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    environment: { MINIO_ROOT_USER: legere, MINIO_ROOT_PASSWORD: legere-secret }
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio-data:/data']
  docling:
    # Built rather than pulled: the upstream image ships tesseract with English only, and our
    # Dockerfile adds the languages a document archive actually meets (ADR-018, docs/05 §5.5).
    # `dev:up` builds it the first time — with an older buildx (< 0.17) compose cannot build at all,
    # so do it by hand once: `docker build -t legere-docling:dev deploy/docling`.
    image: legere-docling:dev
    build: ./deploy/docling
    environment:
      DOCLING_SERVE_ENABLE_UI: 'false'
    ports: ['127.0.0.1:5001:5001']
  ollama:
    # The AI step (categories, languages, where a document is from) talks to anything
    # OpenAI-compatible; this is the one you can run without an account. Point .env at it:
    #   CLASSIFIER_API_BASE_URL=http://localhost:11434/v1
    #   CLASSIFIER_MODEL=mistral-nemo:12b
    # and pull the model once: `docker compose exec ollama ollama pull mistral-nemo:12b`.
    # Size matters more than you would guess for this job — docs/12 §12.5 has the measurement.
    # On macOS this container has no access to the GPU — Docker cannot pass Metal through, so it
    # runs on CPU and a 7B model answers in tens of seconds rather than instantly. Fine for trying
    # the pipeline out; run ollama natively if you want it quick.
    image: ollama/ollama:latest
    ports: ['127.0.0.1:11434:11434']
    volumes: ['ollama-data:/root/.ollama']
  createbuckets:
    image: minio/mc
    depends_on: [minio]
    # `depends_on` only waits for the container to start, not for MinIO to accept
    # connections; retry `mc alias set` until it is ready so the bucket reliably
    # exists after `dev:up` (docs/12 §12.5 acceptance).
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 legere legere-secret; do
                    echo 'waiting for minio...'; sleep 1; done &&
                  mc mb --ignore-existing local/legere"
volumes: { db-data: {}, minio-data: {}, ollama-data: {} }
