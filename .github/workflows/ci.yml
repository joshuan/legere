name: CI
on:
  pull_request:
  push:
    branches: [main]

# 🔒 SEC-21. Least privilege for `GITHUB_TOKEN`: this job installs dependencies, which runs
# third-party lifecycle scripts on every push to `main`, and it needs nothing back from the API.
# Without this block the token takes the repository default, which may still be read-write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: legere, POSTGRES_PASSWORD: legere, POSTGRES_DB: legere_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U legere -d legere_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://legere:legere@localhost:5432/legere_test?schema=public
      APP_BASE_URL: http://localhost:3000
      AUTH_SECRET: test-secret-minimum-32-characters!!
      LIBRARY_ROOT: /tmp/test-library
      STIRLING_URL: http://localhost:8080
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: test
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ''
    steps:
      # 🔒 SEC-21. Third-party actions are pinned to a commit SHA, not to a floating major tag: a tag
      # is mutable and this pipeline runs on every push to `main`. The version stays in the comment
      # so a person can read it and Dependabot can move both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      # 🔒 SEC-07/SEC-21. The audit runs before anything is installed or built, so an advisory
      # published overnight is reported as a failed build rather than as a finding in the next audit.
      # `--omit=dev` and `high` are the threshold: what ships in the image, at the severity that
      # warrants stopping a merge. Moderate findings in dev-only tooling arrive as Dependabot PRs.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate # apply migrations to the test DB
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage # domain+application floor of docs/14 §14.8, enforced
      - run: npm run build
