name: Release
on:
  push:
    branches: [main]
    tags: ['v*']

# 🔒 SEC-21. Read-only by default; `packages: write` is granted to the two jobs that push the image,
# `contents: write` to the one that publishes the GitHub Release, and the scan gets neither.
permissions:
  contents: read

# Each platform builds on a runner of its own architecture and pushes an untagged manifest by digest;
# a final job stitches the digests into one multi-platform tag. The obvious alternative — one job
# with `platforms: linux/amd64,linux/arm64` under QEMU — does not work here: emulated arm64 makes
# `prisma generate` fall back to its wasm engine, which rejects `env("DATABASE_URL")` in the schema
# (P1012). Native runners also build in a third of the time.
env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      # 🔒 SEC-21. Every third-party action is pinned to a commit SHA — a major tag is mutable, and
      # this pipeline holds `packages: write` over the image every deployment pulls. The version in
      # the comment is what a person reads and what Dependabot rewrites alongside the SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          # No tags here: tagging happens once, in `merge`, over both digests.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
      - name: Create the multi-platform tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Show what was published
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"

  # The release is the tag (docs/13 §13.3a): the same push carries the version commit and the tag,
  # and the GitHub Release is published here, once the image the tag names exists — with generated
  # notes, so no by-hand step ties the three together. Re-runs are harmless: an existing release is
  # left as it is.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  # 🔒 SEC-07/SEC-21. `npm audit` in CI covers what the lockfile declares; it says nothing about the
  # Alpine packages and the native libraries underneath — which is exactly where the libvips CVEs
  # that started this lived. The scan runs after publication and on the tag that was published, so
  # what is reported is the artifact deployments pull, not an approximation of it.
  scan:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.merge.outputs.version }}
          severity: HIGH,CRITICAL
          # A finding nobody can act on is a broken build nobody can fix: an unfixed base-image CVE
          # has no upgrade to take. Fixed ones do, and those fail the job.
          ignore-unfixed: true
          exit-code: '1'
